<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842" role="img"><title>线性代数 · 行列式与矩阵典型题（题解）</title><rect width="595" height="842" fill="#FFFFFF"/><rect x="0" y="0" width="595" height="36" fill="#F6F7F5"/><text x="24" y="23" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#69756E">演示预览 · 第 1 页 · 非真实 PDF 渲染</text><text x="24" y="76" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="600" fill="#202A25">线性代数 · 行列式与矩阵典型题（题解）</text><line x1="24" y1="92" x2="571" y2="92" stroke="#DFE5DF" stroke-width="1"/><text x="24" y="120" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">题 1　交换两列以后，为什么答案要变号？</text><text x="24" y="144" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">行列式的定义是带符号的求和：det A = Σ (−1)^τ a₁τ(1)…aₙτ(n)。</text><text x="24" y="168" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">交换两列相当于对列指标做一次对换，置换奇偶性翻转，因此整体变号。</text><text x="24" y="192" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">而矩阵交换两列只是初等列变换，矩阵本身不变号——这里最容易混。</text><text x="24" y="230" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">题 2　行列式与矩阵的规则对照</text><text x="24" y="254" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">· |AB| = |A||B|，但 |A+B| ≠ |A|+|B|；</text><text x="24" y="278" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">· |kA| = kⁿ|A|（n 阶），不是 k|A|；</text><text x="24" y="302" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">· 矩阵 AB ≠ BA，行列式 |AB| = |BA|。</text><text x="24" y="340" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">题 3　用行列式判断可逆</text><text x="24" y="364" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">A 可逆 ⇔ det A ≠ 0。求逆时先确认这一点，再写伴随矩阵或做初等行变换。</text><text x="24" y="402" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">说明：本页为演示题解，用于展示资料详情页的版式与文件元信息。</text><rect x="24" y="432" width="547" height="72" rx="6" fill="#F6F7F5" stroke="#DFE5DF"/><text x="40" y="472" font-family="Cambria,Times New Roman,serif" font-size="14" fill="#202A25">det(Aᵀ) = det(A)　·　det(AB) = det(A)det(B)　·　det(kA) = kⁿ det(A)</text><text x="24" y="806" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="10.5" fill="#9AA5A0">共页 · 静态演示版 · 预览由演示数据生成</text></svg>