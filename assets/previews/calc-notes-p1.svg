<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842" role="img"><title>数列极限与函数连续 · 期中复习笔记</title><rect width="595" height="842" fill="#FFFFFF"/><rect x="0" y="0" width="595" height="36" fill="#F6F7F5"/><text x="24" y="23" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#69756E">演示预览 · 第 1 页 · 非真实 PDF 渲染</text><text x="24" y="76" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="600" fill="#202A25">数列极限与函数连续 · 期中复习笔记</text><line x1="24" y1="92" x2="571" y2="92" stroke="#DFE5DF" stroke-width="1"/><text x="24" y="120" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">一、数列极限的定义与基本性质</text><text x="24" y="144" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">设 {aₙ} 为数列，A 为常数。若对任意 ε&gt;0，存在 N，使 n&gt;N 时 |aₙ−A|&lt;ε，</text><text x="24" y="168" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">则称数列收敛于 A。这里先整理定义、唯一性、有界性与保号性四条。</text><text x="24" y="206" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">1. 唯一性：收敛数列的极限唯一。反设两个极限，取 ε 为差的一半即得矛盾。</text><text x="24" y="230" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">2. 有界性：收敛必有界，但反过来不成立（例：aₙ=(−1)ⁿ）。</text><text x="24" y="254" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">3. 保号性：若 A&gt;0，则存在 N，使 n&gt;N 时 aₙ&gt;A/2。</text><text x="24" y="292" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">二、夹逼准则的三种常用写法</text><text x="24" y="316" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">① 两端都是常数列；② 一端常数一端随 n 变化；③ 用绝对值估计上下界。</text><text x="24" y="340" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">做题时把「我构造的上下界」写在旁边，纠错时更容易指出问题。</text><text x="24" y="378" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">三、函数连续：把极限搬到点上</text><text x="24" y="402" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">f 在 x₀ 连续 ⇔ lim(x→x₀) f(x) = f(x₀)。三个条件拆开写：函数在该点有定义、</text><text x="24" y="426" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">极限存在、两者相等。分段函数的分界点一定要左右极限分别写。</text><text x="24" y="464" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">四、本节尚未覆盖</text><text x="24" y="488" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">导数与中值定理部分还在整理，下一版补上；本页出现的例题仅演示版式。</text><rect x="24" y="518" width="547" height="72" rx="6" fill="#F6F7F5" stroke="#DFE5DF"/><text x="40" y="558" font-family="Cambria,Times New Roman,serif" font-size="14" fill="#202A25">lim(n→∞) (1 + 1/n)ⁿ = e　·　|aₙ − A| &lt; ε　·　f(x₀−) = f(x₀+) = f(x₀)</text><text x="24" y="806" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="10.5" fill="#9AA5A0">共页 · 静态演示版 · 预览由演示数据生成</text></svg>