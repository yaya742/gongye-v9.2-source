<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842" role="img"><title>数列极限与函数连续 · 期中复习笔记</title><rect width="595" height="842" fill="#FFFFFF"/><rect x="0" y="0" width="595" height="36" fill="#F6F7F5"/><text x="24" y="23" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#69756E">演示预览 · 第 2 页 · 非真实 PDF 渲染</text><text x="24" y="76" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="19" font-weight="600" fill="#202A25">数列极限与函数连续 · 期中复习笔记</text><line x1="24" y1="92" x2="571" y2="92" stroke="#DFE5DF" stroke-width="1"/><text x="24" y="120" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">五、典型题：单调有界</text><text x="24" y="144" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">证明 a₁=√2，aₙ₊₁=√(2+aₙ) 收敛并求极限。</text><text x="24" y="168" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">先用归纳法证有界（aₙ&lt;2），再证单调递增：aₙ₊₁²−aₙ² = 2+aₙ−aₙ² ≥ 0。</text><text x="24" y="192" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">然后设极限为 A，由 A=√(2+A) 解得 A=2（另一根 −1 舍去）。</text><text x="24" y="230" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">六、典型题：夹逼</text><text x="24" y="254" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">求 lim (1/√(n²+1) + 1/√(n²+2) + … + 1/√(n²+n))。</text><text x="24" y="278" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">下界 n/√(n²+n)，上界 n/√(n²+1)，两端极限都是 1。</text><text x="24" y="316" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">七、我踩过的坑（欢迎纠错）</text><text x="24" y="340" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">· 把「有界」直接当成「收敛」；</text><text x="24" y="364" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">· 夹逼时上界写错方向；</text><text x="24" y="388" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12.5" fill="#3C4A43">· 连续性的第三个条件（函数值等于极限值）漏写。</text><rect x="24" y="418" width="547" height="72" rx="6" fill="#F6F7F5" stroke="#DFE5DF"/><text x="40" y="458" font-family="Cambria,Times New Roman,serif" font-size="14" fill="#202A25">aₙ₊₁ = √(2 + aₙ)　·　A = √(2 + A)　⇒　A = 2</text><text x="24" y="806" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="10.5" fill="#9AA5A0">共页 · 静态演示版 · 预览由演示数据生成</text></svg>